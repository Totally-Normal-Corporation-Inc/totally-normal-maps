name: Verify public service
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m unittest discover -q
      - run: python tools/check_publication.py --staged
      - run: python tools/check_secrets.py --staged
      - run: python -m pip_audit -r requirements.lock -r requirements-s3.lock --no-deps --disable-pip
      - run: python -m build --no-isolation
      - run: python tools/check_artifacts.py --staged dist/*.whl dist/*.tar.gz
      - run: python -m tools.make_ci_bundle --output /tmp/maps-ci-bundle
      - run: docker build --target bundled-local --build-context deployment_bundle=/tmp/maps-ci-bundle --tag maps-ci .
      - run: python tools/check_container.py --image maps-ci --lock /tmp/maps-ci-bundle/dataset.lock.json
      # No publishing, deployment, credentials, cloud writes, or government downloads.
